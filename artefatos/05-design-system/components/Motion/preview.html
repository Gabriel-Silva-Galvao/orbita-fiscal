<!-- @dsCard group="Movimento" height=330 subtitle="Entrada, hover, órbita e traço" -->
<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400&display=swap"><style>*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font:400 1rem/1.62 var(--font-body);padding:var(--space-5)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:var(--space-5);align-items:start}
.cap{font:600 0.6875rem/1 var(--font-body);letter-spacing:.06em;color:var(--mute);margin:0 0 var(--space-3);text-transform:uppercase}
.card{border:1px solid var(--line);border-radius:var(--radius-lg);background:var(--surface);padding:var(--space-4);font-size:14px;line-height:21px}
.in{animation:up .8s cubic-bezier(.2,.8,.2,1) both}.in:nth-child(2){animation-delay:.09s}.in:nth-child(3){animation-delay:.18s}
@keyframes up{from{opacity:0;transform:translateY(28px) scale(.985)}to{opacity:1;transform:none}}
.stack{display:grid;gap:6px}
.btn{position:relative;overflow:hidden;isolation:isolate;display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 20px;border-radius:var(--radius-pill);border:1px solid transparent;background:var(--brand);color:var(--on-brand);font:600 15px/1 var(--font-body);cursor:pointer;transition:color .3s ease-out}
.btn::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--ink);transform:translateY(101%);border-radius:inherit;transition:transform .42s cubic-bezier(.2,.8,.2,1)}
.btn:hover::before{transform:none}.btn:hover{color:var(--bg)}
.btn:focus-visible{outline:3px solid var(--brand);outline-offset:3px}
.atom{width:120px;cursor:pointer}
.draw{fill:none;stroke:var(--brand);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.4s cubic-bezier(.65,0,.35,1) .3s forwards}
.draw:nth-child(2){animation-delay:.45s}.draw:nth-child(3){animation-delay:.6s}
@keyframes draw{to{stroke-dashoffset:0}}
.nuc{transform-origin:50px 50px;transform-box:view-box;animation:breathe 4.8s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.06)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.draw{stroke-dashoffset:0}}</style></head><body>
<div class="grid">
<div><p class="cap">Entrada em cascata</p><div class="stack"><div class="card in">Primeiro bloco</div><div class="card in">Segundo, 90 ms depois</div><div class="card in">Terceiro</div></div></div>
<div><p class="cap">Hover do botão</p><button class="btn" type="button">Ver planos</button></div>
<div><p class="cap">Órbita (passe o mouse)</p>
<svg class="atom" id="atom" viewBox="6 14 88 72" aria-label="Símbolo com elétrons em órbita" role="img"><g id="rings" transform="rotate(-28 50 50)"><ellipse cx="50" cy="50" rx="43" ry="28" fill="none" stroke="var(--brand)" stroke-width="2.6"/><ellipse cx="50" cy="50" rx="27" ry="17" fill="none" stroke="var(--brand)" stroke-width="2.6"/><circle class="e" data-r="in" data-a="3.1416" cx="23" cy="50" r="3.4" fill="var(--bg)" stroke="var(--ink)" stroke-width="2"/><circle class="e" data-r="in" data-a="0" cx="77" cy="50" r="3.4" fill="var(--bg)" stroke="var(--ink)" stroke-width="2"/><circle class="e" data-r="out" data-a="0" cx="93" cy="50" r="3.4" fill="var(--bg)" stroke="var(--ink)" stroke-width="2"/></g><g class="nuc"><circle cx="57.2" cy="50" r="4.4" fill="var(--brand)"/><circle cx="46.4" cy="56.2" r="4.4" fill="var(--brand)"/><circle cx="46.4" cy="43.8" r="4.4" fill="var(--brand)"/><circle cx="53.6" cy="56.2" r="4.4" fill="var(--nucleus)"/><circle cx="42.8" cy="50" r="4.4" fill="var(--nucleus)"/><circle cx="53.6" cy="43.8" r="4.4" fill="var(--nucleus)"/><circle cx="50" cy="50" r="4.4" fill="var(--nucleus)"/></g></svg></div>
<div><p class="cap">Traço que se desenha</p><svg width="64" height="64" viewBox="0 0 48 48" aria-hidden="true"><path class="draw" pathLength="1" d="M10 8h20l8 8v24H10z"/><path class="draw" pathLength="1" d="M16 22h14M16 28h10"/><path class="draw" pathLength="1" d="M28 34a6 6 0 1 0 12 0a6 6 0 1 0 -12 0M38.5 38.5l4 4"/></svg></div>
</div>
<script>
(function(){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var R={in:{rx:27,ry:17,p:7000},out:{rx:43,ry:28,p:12000}};
  var svg=document.getElementById('atom'),rings=document.getElementById('rings');
  var es=[].slice.call(svg.querySelectorAll('.e')).map(function(el){return{el:el,r:R[el.getAttribute('data-r')],a:+el.getAttribute('data-a')}});
  var hot=false,speed=1,tilt=-28,last=performance.now();
  svg.addEventListener('pointerenter',function(){hot=true});svg.addEventListener('pointerleave',function(){hot=false});
  function f(now){var dt=Math.min(now-last,64);last=now;speed+=((hot?6:1)-speed)*Math.min(1,dt/220);tilt+=((hot?-14:-28)-tilt)*Math.min(1,dt/260);
    rings.setAttribute('transform','rotate('+tilt.toFixed(2)+' 50 50)');
    es.forEach(function(e){e.a=(e.a+Math.PI*2*dt*speed/e.r.p)%(Math.PI*2);e.el.setAttribute('cx',(50+e.r.rx*Math.cos(e.a)).toFixed(2));e.el.setAttribute('cy',(50+e.r.ry*Math.sin(e.a)).toFixed(2))});
    requestAnimationFrame(f)}
  requestAnimationFrame(f);
})();
</script></body></html>
