<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400&display=swap"><style>*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font:400 1rem/1.62 var(--font-body);padding:var(--space-5)}
.row{display:flex;flex-wrap:wrap;gap:var(--space-4);align-items:center}.cap{font:600 0.6875rem/1 var(--font-body);letter-spacing:.06em;color:var(--mute);margin:var(--space-4) 0 var(--space-2);text-transform:uppercase}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;border-radius:var(--radius-pill);border:1px solid var(--brand);background:var(--brand);color:var(--on-brand);font:600 15px/1 var(--font-body);cursor:pointer;text-decoration:none;transition:background .28s ease,transform .28s ease}
.btn.sec{background:transparent;color:var(--ink);border-color:var(--line-strong)}
.btn:focus-visible,.field input:focus-visible{outline:3px solid var(--brand);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}.faq{max-width:720px;border-top:1px solid var(--line)}details{border-bottom:1px solid var(--line);padding:var(--space-4) 0}summary{cursor:pointer;font:500 1.0625rem/1.41 var(--font-body);list-style:none;display:flex;justify-content:space-between;gap:16px}summary::after{content:"+";color:var(--brand);font-size:22px;line-height:24px}details[open] summary::after{content:"–"}summary:focus-visible{outline:3px solid var(--brand);outline-offset:3px;border-radius:4px}p{margin:var(--space-3) 0 0;color:var(--mute);font-size:15px;line-height:23px}.tbd{display:inline-block;white-space:nowrap;border:1px dashed var(--brand);border-radius:var(--radius-sm);padding:0 6px;font-size:13px;color:var(--brand)}</style></head><body><div class="faq"><details open><summary>Com qual IA funciona?</summary><p>Hoje, com o Claude. <span class="tbd">Outras IAs: a definir</span></p></details><details><summary>Como funciona o reembolso?</summary><p>Você pode pedir o reembolso integral em até 7 dias após a compra.</p></details><details><summary>Qual a cobertura da base e quando ela é atualizada?</summary><p><span class="tbd">Cobertura e frequência de atualização: a definir antes do lançamento</span></p></details></div></body></html>
