<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400&display=swap"><style>*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font:400 1rem/1.62 var(--font-body);padding:var(--space-5)}
.row{display:flex;flex-wrap:wrap;gap:var(--space-4);align-items:center}.cap{font:600 0.6875rem/1 var(--font-body);letter-spacing:.06em;color:var(--mute);margin:var(--space-4) 0 var(--space-2);text-transform:uppercase}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;border-radius:var(--radius-pill);border:1px solid var(--brand);background:var(--brand);color:var(--on-brand);font:600 15px/1 var(--font-body);cursor:pointer;text-decoration:none;transition:background .28s ease,transform .28s ease}
.btn.sec{background:transparent;color:var(--ink);border-color:var(--line-strong)}
.btn:focus-visible,.field input:focus-visible{outline:3px solid var(--brand);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}.badge{font:600 11px/1 var(--font-body);letter-spacing:.06em;background:var(--brand);color:var(--on-brand);padding:6px 10px;border-radius:var(--radius-pill)}
.tab{border:1px solid var(--line-strong);border-radius:var(--radius-pill);padding:11px 16px;font:500 14px/1 var(--font-body)}.tab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tbd{display:inline-block;white-space:nowrap;border:1px dashed var(--brand);border-radius:var(--radius-sm);padding:0 6px;font-size:13px;color:var(--brand)}.eyebrow{font:600 0.6875rem/1 var(--font-body);letter-spacing:.06em;color:var(--brand)}</style></head><body><div class="row"><span class="badge">COMPLETO</span><span class="tab on">Pesquisar</span><span class="tab">Conferir o processo</span><span class="tab">Preparar a peça</span><span class="tbd">a confirmar</span><span class="eyebrow">PLUGIN PARA CLAUDE</span></div></body></html>
