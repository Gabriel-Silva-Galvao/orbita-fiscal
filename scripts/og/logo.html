<!doctype html>
<!--
  Logo quadrado em PNG, 512x512 (SEO, etapa 8c): o Google pede um logo raster para a Organization
  nos dados estruturados. Gerado junto com a og.png por: npm run og
-->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
  :root { --bg:#f2f6ef; --ink:#102f31; --brand:#10634f; --nucleus:#213947; }
  * { margin: 0; }
  html, body { width: 512px; height: 512px; overflow: hidden; background: var(--bg); }
  body { display: grid; place-items: center; }
  svg { width: 420px; height: auto; }
</style>
</head>
<body>
  <svg viewBox="6 14 88 72" aria-hidden="true">
        <g transform="rotate(-28 50 50)">
          <ellipse cx="50" cy="50" rx="43" ry="28" fill="none" stroke="var(--brand)" stroke-width="3.2"/>
          <ellipse cx="50" cy="50" rx="27" ry="17" fill="none" stroke="var(--brand)" stroke-width="3.2"/>
          <circle cx="77" cy="50" r="4" fill="var(--bg)" stroke="var(--ink)" stroke-width="2.4"/>
          <circle cx="23" cy="50" r="4" fill="var(--bg)" stroke="var(--ink)" stroke-width="2.4"/>
        </g>
        <g stroke="var(--bg)" stroke-width=".7">
          <circle cx="57.2" cy="50" r="4.4" fill="var(--brand)"/><circle cx="46.4" cy="56.236" r="4.4" fill="var(--brand)"/>
          <circle cx="46.4" cy="43.764" r="4.4" fill="var(--brand)"/><circle cx="53.6" cy="56.236" r="4.4" fill="var(--nucleus)"/>
          <circle cx="42.8" cy="50" r="4.4" fill="var(--nucleus)"/><circle cx="53.6" cy="43.764" r="4.4" fill="var(--nucleus)"/>
          <circle cx="50" cy="50" r="4.4" fill="var(--nucleus)"/>
        </g>
      </svg>
</body>
</html>
