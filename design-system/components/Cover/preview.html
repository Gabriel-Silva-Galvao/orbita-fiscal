<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400&display=swap"><style>html,body{margin:0}body{background:var(--bg);width:960px;height:360px;position:relative;overflow:hidden;font-family:var(--font-body)}
svg{position:absolute;inset:0}.a{fill:var(--brand)}.b{fill:var(--soft)}.c{fill:var(--ink)}.d{fill:var(--mute)}.cut{fill:none;stroke:var(--bg);stroke-width:6}.dot{fill:var(--bg)}
.t{position:absolute;left:32px;bottom:28px;width:440px}h1{margin:0;font:400 120px/.95 var(--font-display);letter-spacing:-.01em;color:var(--ink)}p{margin:8px 0 0;font:400 0.875rem/1.43 var(--font-body);color:var(--mute)}</style></head><body>
<svg width="960" height="360" viewBox="0 0 960 360" aria-hidden="true">
<!-- blocos: brand 288x224, soft 184x136, ink 184x216, mute 288x128 (space-2 de vão) -->
<!-- arranjo: laje larga à esquerda e coluna à direita, sangrando no topo e na direita -->
<!-- padrão: elipses inclinadas -28 graus recortadas no fundo, porque a marca é um átomo de órbitas -->
<!-- passos 8px, raios radius-lg 14 -->
<rect class="a" x="480" y="0" width="288" height="224" rx="14"/><rect class="b" x="776" y="0" width="184" height="136" rx="14"/><rect class="c" x="776" y="144" width="184" height="216" rx="14"/><rect class="d" x="480" y="232" width="288" height="128" rx="14"/>
<g transform="rotate(-28 768 180)"><ellipse class="cut" cx="768" cy="180" rx="250" ry="150"/><ellipse class="cut" cx="768" cy="180" rx="150" ry="90"/></g>
<circle class="dot" cx="768" cy="180" r="14"/><circle class="a" cx="768" cy="180" r="7"/></svg>
<div class="t"><h1>Órbita Fiscal</h1><p>A jurisprudência brasileira, dentro da IA que você já usa.</p></div></body></html>
